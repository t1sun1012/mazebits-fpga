name: MazeBits verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install CPU training dependencies
        run: python -m pip install -r requirements.txt
      - name: Run maze reference tests
        run: python -m unittest discover -s python/tests -v
      - name: Load the trained CNN and run an example
        run: python python/predict.py --maze open
      - name: Run the deterministic reference demo
        run: python python/demo.py --maze detour
      - name: Verify W8A8 memory and scalar reference vectors
        run: python python/verify_fixed_vectors.py --model-dir model/cnn-w8a8 --vectors-dir test_vectors/cnn-w8a8
      - name: Verify W4A4 memory and scalar reference vectors
        run: python python/verify_fixed_vectors.py --model-dir model/cnn-w4a4 --vectors-dir test_vectors/cnn-w4a4
      - name: Verify improved W8A8 reference bundle
        run: python python/verify_fixed_vectors.py --model-dir model/cnn-structured-w8a8 --vectors-dir test_vectors/cnn-structured-w8a8
      - name: Verify improved W4A4 reference bundle
        run: python python/verify_fixed_vectors.py --model-dir model/cnn-structured-w4a4 --vectors-dir test_vectors/cnn-structured-w4a4
      - name: Replay improved floating-point detour
        run: python python/predict.py --model-dir model/cnn-structured-fp32 --maze-file results/navigation/counterexamples/long-detour.txt

  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bits: [8, 4]
        model_set: [original, structured]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Verify RTL against all reference vectors
        run: python scripts/run_rtl.py --simulator iverilog --bits ${{ matrix.bits }} --model-set ${{ matrix.model_set }}
      - name: Verify button and reset control logic
        if: matrix.model_set == 'original'
        run: python scripts/run_board_smoke.py --sim iverilog --bits ${{ matrix.bits }}

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Verify editor controls and complete VGA frames
        run: python scripts/run_editor.py --sim iverilog

  navigation-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Verify navigation controls, physical inputs, and VGA frames
        run: python scripts/run_navigation.py --sim iverilog --tests controller top vga

  navigation-cnn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Verify both real CNNs and complete closed-loop paths
        run: python scripts/run_navigation.py --sim iverilog --tests cnn --timeout 1500

  navigation-cnn-structured:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Verify improved dual CNNs on seven complete scenarios
        run: python scripts/run_navigation.py --sim iverilog --tests cnn --model-set structured --timeout 3300
